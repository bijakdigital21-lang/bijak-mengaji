<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Auto User Creator</title>
    <!-- Tailwind CSS untuk reka bentuk yang kemas -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Tambah Pengguna Firebase</h2>
        
        <form id="createUserForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">E-mel Customer</label>
                <input type="email" id="email" required 
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="contoh@email.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Password Lalai</label>
                <input type="text" value="GH548257af" disabled 
                    class="mt-1 block w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md shadow-sm text-gray-500 cursor-not-allowed">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition duration-200 font-medium">
                Create User
            </button>
        </form>

        <div id="statusMessage" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Konfigurasi Firebase anda
        const firebaseConfig = {
            apiKey: "AIzaSyDXc06B8WLtqjkG0aScBHrd3L3M-n_5okc",
            authDomain: "grammar-hub-6af80.firebaseapp.com",
            databaseURL: "https://grammar-hub-6af80-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "grammar-hub-6af80",
            storageBucket: "grammar-hub-6af80.firebasestorage.app",
            messagingSenderId: "1092171234032",
            appId: "1:1092171234032:web:7cc8efefb812993500e035"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('createUserForm');
        const emailInput = document.getElementById('email');
        const statusMessage = document.getElementById('statusMessage');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const defaultPassword = "GH548257af";

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sedang diproses...';
            statusMessage.textContent = '';

            try {
                // Cipta akaun di Firebase Authentication
                await createUserWithEmailAndPassword(auth, email, defaultPassword);
                
                statusMessage.className = "mt-4 text-center text-sm font-medium text-green-600";
                statusMessage.textContent = `Berjaya! Pengguna ${email} telah dicipta.`;
                emailInput.value = '';
            } catch (error) {
                statusMessage.className = "mt-4 text-center text-sm font-medium text-red-600";
                statusMessage.textContent = `Ralat: ${error.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create User';
            }
        });
    </script>
</body>
</html>
