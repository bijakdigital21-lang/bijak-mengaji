<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Senarai Customer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .admin-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
            position: relative;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 5px;
        }
        .btn-refresh {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-refresh:hover {
            background-color: #0056b3;
        }
        /* Jadual Admin */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: left;
            font-size: 13px;
        }
        th {
            background-color: #f8f9fa;
        }
        /* Stail untuk pautan WhatsApp pada nombor telefon */
        .whatsapp-link {
            color: #25d366;
            text-decoration: none;
            font-weight: bold;
        }
        .whatsapp-link:hover {
            text-decoration: underline;
        }
        /* Stail untuk pautan Emel */
        .email-link {
            color: #d93025;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }
        .email-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- PAPARAN ADMIN (Terus Dibuka Tanpa Password) -->
    <div class="admin-container" id="adminView">
        <div class="header-flex">
            <h2>Admin Panel - Senarai Customer</h2>
            <button class="btn-refresh" id="refreshBtn" type="button">🔄 Refresh Data</button>
        </div>
        <p style="font-size: 13px; color: #666; margin-top: 0;">Semua maklumat pendaftaran terkini dalam sistem (Tekan pada no. telefon atau emel untuk terus hantar mesej):</p>
        
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>Email</th>
                        <th>No. Telefon</th>
                        <th>Tarikh Daftar</th>
                    </tr>
                </thead>
                <tbody id="customerTableBody">
                    <tr>
                        <td colspan="4" style="text-align: center;">Memuatkan data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDK & Skrip -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi Firebase anda
        const firebaseConfig = {
            apiKey: "AIzaSyDXc06B8WLtqjkG0aScBHrd3L3M-n_5okc",
            authDomain: "grammar-hub-6af80.firebaseapp.com",
            databaseURL: "https://grammar-hub-6af80-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "grammar-hub-6af80",
            storageBucket: "grammar-hub-6af80.firebasestorage.app",
            messagingSenderId: "1092171234032",
            appId: "1:1092171234032:web:7cc8efefb812993500e035"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Elemen UI
        const customerTableBody = document.getElementById('customerTableBody');
        const refreshBtn = document.getElementById('refreshBtn');

        // Terus muatkan data admin sebaik sahaja halaman dibuka
        window.addEventListener('DOMContentLoaded', () => {
            loadCustomerData();
        });

        // Event listener untuk butang refresh
        refreshBtn.addEventListener('click', () => {
            loadCustomerData();
        });

        // Fungsi Tarik Data Customer
        async function loadCustomerData() {
            customerTableBody.innerHTML = `<tr><td colspan="4" style="text-align: center;">Sedang memuat data...</td></tr>`;
            try {
                const dbRef = ref(db, 'customers');
                const snapshot = await get(dbRef);
                
                if (snapshot.exists()) {
                    let customersArray = [];

                    // Masukkan data ke dalam array terlebih dahulu
                    snapshot.forEach((childSnapshot) => {
                        const data = childSnapshot.val();
                        if (data) {
                            customersArray.push(data);
                        }
                    });

                    // Sorting: Paling lewat (terkini) di atas sekali
                    customersArray.sort((a, b) => {
                        let timeA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
                        let timeB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
                        return timeB - timeA; // Descending order
                    });

                    let rows = "";
                    customersArray.forEach((data) => {
                        let formattedDate = data.createdAt ? new Date(data.createdAt).toLocaleString() : '-';
                        let rawPhone = data.phone || '';
                        let customerEmail = data.email || '';
                        
                        // Pembersihan nombor telefon untuk pautan WhatsApp
                        let cleanPhone = rawPhone.replace(/\D/g, ''); 
                        if (cleanPhone.startsWith('0')) {
                            cleanPhone = '6' + cleanPhone; 
                        }

                        // Templat mesej WhatsApp
                        let whatsappMessage = `🎉 TERIMA KASIH ATAS PEMBELIAN ANDA!

Terima kasih kerana memilih Grammar Hub! 💙

Kami sangat teruja untuk anda mula belajar, berlatih dan meneroka pelbagai bahan pembelajaran yang telah disediakan untuk membantu meningkatkan penguasaan English Grammar dengan lebih mudah dan menyeronokkan.

📚 AKSES GRAMMAR HUB ANDA

Klik pautan di bawah untuk mula menggunakan Grammar Hub:

👇🏻👇🏻
https://bijakdigital21-lang.github.io/Grammarhub./

🔐 MAKLUMAT LOG MASUK

Email: ${customerEmail}
Password: GH548257af

📌 Sila tukar password anda di laman profile selepas berjaya log masuk ke aplikasi ini.

⚠️ PENTING

📌 Simpan pautan Grammar Hub ini untuk rujukan dan akses anda pada masa akan datang.

Sertai group reseller kami untuk info dan sokongan berterusan.
👇🏻👇🏻👇🏻
https://t.me/%2BZ-uxVSN8A54zNTdl

📱 Sekiranya anda mengalami sebarang masalah untuk membuka atau mengakses Grammar Hub, jangan risau.

Hubungi kami melalui WhatsApp dan kami sedia membantu.

💙 Selamat belajar!`;

                        let encodedWhatsappMessage = encodeURIComponent(whatsappMessage);
                        let whatsappUrl = `https://wa.me/${cleanPhone}?text=${encodedWhatsappMessage}`;

                        // Templat Subjek dan Mesej Emel
                        let emailSubject = "Akses & Maklumat Log Masuk Grammar Hub Anda";
                        let emailBody = `TERIMA KASIH! 🎉

Kami sangat teruja untuk anda mula belajar, berlatih dan meneroka pelbagai bahan pembelajaran yang disediakan dalam Grammar Hub.

Semoga Grammar Hub dapat membantu meningkatkan penguasaan English Grammar dengan cara yang lebih mudah, menyeronokkan dan berkesan!

🔐 AKSES GRAMMAR HUB ANDA 
https://bijakdigital21-lang.github.io/Grammarhub./

Klik pautan di atas untuk mula menggunakan platform Grammar Hub:

📱 MAKLUMAT LOG MASUK

Email: ${customerEmail}

Password: GH548257af

Sila tukar kata laluan anda melalui ruangan Profile selepas berjaya log masuk.

👥 JOIN GROUP RESELLER GRAMMAR HUB

Sertai group reseller kami di Telegram untuk mendapatkan info terkini, panduan dan sokongan berterusan.
https://t.me/+Z-uxVSN8A54zNTdl

⚠️ PENTING & BANTUAN

Simpan Dokumen Ini:
Simpan dokumen dan pautan Grammar Hub ini untuk rujukan serta akses anda pada masa akan datang.

Bantuan Akses:
Sekiranya anda mengalami sebarang masalah untuk membuka atau mengakses Grammar Hub, hubungi kami terus melalui WhatsApp.
https://www.wasap.my/60196818139/DaftarGrammarHub


🌟 SELAMAT BELAJAR!

Semoga Grammar Hub membantu anda menguasai Bahasa Inggeris dengan lebih mudah, yakin dan menyeronokkan!

Terima kasih atas pembelian dan kepercayaan anda bersama Grammar Hub.`;

                        // Menggunakan Skema Rasmi App Gmail secara terus (Direct Scheme)
                        let gmailAppUrl = `googlegmail://co?to=${encodeURIComponent(customerEmail)}&subject=${encodeURIComponent(emailSubject)}&body=${encodeURIComponent(emailBody)}`;

                        rows += `
                            <tr>
                                <td>${escapeHtml(data.name || '-')}</td>
                                <td><a href="${gmailAppUrl}" class="email-link">✉️ ${escapeHtml(customerEmail || '-')}</a></td>
                                <td><a href="${whatsappUrl}" target="_blank" class="whatsapp-link">${escapeHtml(rawPhone)}</a></td>
                                <td>${formattedDate}</td>
                            </tr>
                        `;
                    });
                    
                    if, rows === "") {
                        customerTableBody.innerHTML = `<tr><td colspan="4" style="text-align: center;">Tiada rekod data customer dijumpai.</td></tr>`;
                    } else {
                        customerTableBody.innerHTML = rows;
                    }
                } else {
                    customerTableBody.innerHTML = `<tr><td colspan="4" style="text-align: center;">Pangkalan data kosong.</td></tr>`;
                }
            } catch (error) {
                console.error("Ralat membaca database:", error);
                customerTableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Gagal memuatkan data. Sila semak Firebase Rules anda.</td></tr>`;
            }
        }

        // Keselamatan asas untuk elak gangguan HTML
        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
