<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paparan Admin - Bijak Belajar</title>
    <!-- Menggunakan Tailwind CSS untuk rekaan moden -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Config Anda
        const firebaseConfig = {
            apiKey: "AIzaSyDXc06B8WLtqjkG0aScBHrd3L3M-n_5okc",
            authDomain: "grammar-hub-6af80.firebaseapp.com",
            databaseURL: "https://grammar-hub-6af80-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "grammar-hub-6af80",
            storageBucket: "grammar-hub-6af80.firebasestorage.app",
            messagingSenderId: "1092171234032",
            appId: "1:1092171234032:web:7cc8efefb812993500e035"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

// Fungsi Tarik Senarai Data Customer & Reseller dari Database secara automatik
        async function loadAdminData() {
            const tableBody = document.getElementById('adminTableBody');
            tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-500">Memuatkan data...</td></tr>`;

            try {
                const dbRef = ref(db, 'users');
                const snapshot = await get(dbRef);

                if (snapshot.exists()) {
                    tableBody.innerHTML = '';
                    const data = snapshot.val();
                    
                    // 1. Tukar objek Firebase kepada Array supaya mudah disusun (sort)
                    let usersArray = [];
                    for (const uid in data) {
                        usersArray.push({
                            uid: uid,
                            ...data[uid]
                        });
                    }

                    // 2. Susun data: Paling latest (tarikh besar/terkini) berada di atas
                    usersArray.sort((a, b) => {
                        let dateA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
                        let dateB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
                        return dateB - dateA; // Descending order (terkini ke lama)
                    });

                    // 3. Paparkan data yang telah disusun ke dalam jadual
                    let counter = 1;
                    usersArray.forEach(user => {
                        const dateFormatted = user.createdAt ? new Date(user.createdAt).toLocaleString() : '-';
                        const userEmail = user.email || '-';
                        let rawPhone = user.nofon || '';

                        // Bersihkan nombor telefon (buang simbol +, -, spasi) untuk format wa.me
                        let cleanPhone = rawPhone.replace(/[^0-9]/g, '');
                        
                        // Jika nombor bermula dengan '0', tukar ke kod negara Malaysia '60'
                        if (cleanPhone.startsWith('0')) {
                            cleanPhone = '60' + cleanPhone.substring(1);
                        }

                        // Templat mesej WhatsApp dengan emel dinamik
                        const waMessage = `🎉 TERIMA KASIH ATAS PEMBELIAN ANDA!

Terima kasih kerana memilih Grammar Hub! 💙

Kami sangat teruja untuk anda mula belajar, berlatih dan meneroka pelbagai bahan pembelajaran yang telah disediakan untuk membantu meningkatkan penguasaan English Grammar dengan lebih mudah dan menyeronokkan.

📚 AKSES GRAMMAR HUB ANDA

Klik pautan di bawah untuk mula menggunakan Grammar Hub:

👇🏻👇🏻
https://bijakdigital21-lang.github.io/Grammarhub./

🔐 MAKLUMAT LOG MASUK

Email: ${userEmail}
Password: GH548257af

📌 Sila tukar password anda di laman profile selepas berjaya log masuk ke aplikasi ini.

⚠️ PENTING

📌 Simpan pautan Grammar Hub ini untuk rujukan dan akses anda pada masa akan datang.

Sertai group reseller kami untuk info dan sokongan berterusan.
👇🏻👇🏻👇🏻
https://t.me/%2BZ-uxVSN8A54zNTdl

📱 Sekiranya anda mengalami sebarang masalah untuk membuka atau mengakses Grammar Hub, jangan risau.

Hubungi kami melalui WhatsApp dan kami sedia membantu.

💙 Selamat belajar!`;

                        // Bina pautan WhatsApp jika nombor telefon wujud
                        let phoneHtml = '-';
                        if (rawPhone) {
                            const encodedMessage = encodeURIComponent(waMessage);
                            phoneHtml = `<a href="https://wa.me/${cleanPhone}?text=${encodedMessage}" target="_blank" class="text-emerald-600 hover:text-emerald-800 underline font-medium flex items-center gap-1 mt-1">
                                <span>📱</span> ${rawPhone}
                            </a>`;
                        }
                        
                        const row = `
                            <tr class="border-b hover:bg-slate-50">
                                <td class="px-4 py-3 text-sm text-slate-700">${counter++}</td>
                                <td class="px-4 py-3 text-sm font-medium text-slate-800">${user.nama || '-'}</td>
                                <td class="px-4 py-3 text-sm text-slate-600">${userEmail}<br>${phoneHtml}</td>
                                <td class="px-4 py-3 text-sm font-semibold text-emerald-700">${user.reseller_rujukan || '-'}</td>
                                <td class="px-4 py-3 text-sm text-slate-500">${dateFormatted}</td>
                            </tr>
                        `;
                        tableBody.innerHTML += row;
                    });
                } else {
                    tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-500">Tiada rekod ditemui.</td></tr>`;
                }
            } catch (error) {
                console.error("Ralat memuatkan data:", error);
                tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-red-500">Gagal memuatkan data dari pangkalan data.</td></tr>`;
            }
        }

        // Panggil fungsi muat data apabila halaman selesai dimuatkan
        window.addEventListener('DOMContentLoaded', () => {
            loadAdminData();
        });
    </script>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4 flex flex-col items-center">

    <!-- Kontena Utama Dashboard Admin -->
    <div class="w-full max-w-5xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 flex flex-col">
        
        <!-- Pengepala (Header) Dashboard -->
        <div class="p-6 bg-slate-800 text-white flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Dashboard Admin</h1>
                <p class="text-xs text-slate-400 mt-1">Senarai Penuh Customer & Reseller Rujukan</p>
            </div>
            <button onclick="location.reload()" class="bg-slate-700 hover:bg-slate-600 text-white text-sm px-4 py-2 rounded-lg transition duration-200 flex items-center gap-2">
                <span>🔄</span> Muat Semula Data
            </button>
        </div>

        <!-- Bahagian Jadual Rekod -->
        <div class="p-6 overflow-y-auto flex-1">
            <div class="overflow-x-auto border border-slate-200 rounded-xl">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 border-b text-slate-700 text-sm">
                            <th class="px-4 py-3 font-semibold">No.</th>
                            <th class="px-4 py-3 font-semibold">Nama Customer</th>
                            <th class="px-4 py-3 font-semibold">Emel / Telefon Customer</th>
                            <th class="px-4 py-3 font-semibold">Nama Reseller Rujukan</th>
                            <th class="px-4 py-3 font-semibold">Tarikh Daftar</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- Data akan dimasukkan secara dinamik melalui JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Footer Kecil -->
        <div class="p-4 bg-slate-50 border-t text-center text-xs text-slate-500">
            Sistem Paparan Admin Terbuka &bull; Bijak Belajar
        </div>
    </div>

</body>
</html>
